services:
  server:
    build: "."
    restart: "on-failure"

    environment:
      - DATABASE_URL=jdbc:postgresql://database:5432/lab3
      - DATABASE_USER=lab3user
      - DATABASE_PASSWORD=b62b0c50929949c3e6e1fb65f6a63e58a2cc374e8965e201bee53d93fb758b5a
      - JBOSS_MODULES_SYSTEM_PKGS=org.jboss.byteman,com.sun.management
      - JAVA_OPTS_APPEND=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9010 -Dcom.sun.management.jmxremote.rmi.port=9010 -Dcom.sun.management.jmxremote.local.only=false -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=127.0.0.1

    ports:
      - 8888:8080
      - 9990:9990
      - 9010:9010

  db:
    image: "postgres"
    restart: "on-failure"
    hostname: "database"

    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
      - database:/var/lib/postgresql

    environment:
      - POSTGRES_DB=lab3
      - POSTGRES_USER=lab3user
      - POSTGRES_PASSWORD=b62b0c50929949c3e6e1fb65f6a63e58a2cc374e8965e201bee53d93fb758b5a

volumes:
  database:
